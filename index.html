document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fspan>Flat fee, predictable cash flow<\u002Fp>\n            <p style=\"display: flex; gap: 11px; margin: 0; font: 400 13.5px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.85);\"><span style=\"flex: 0 0 auto; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: #F8F6F0;\"><\u002Fspan>Reprioritise every sprint<\u002Fp>\n            <p style=\"display: flex; gap: 11px; margin: 0; font: 400 13.5px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.85);\"><span style=\"flex: 0 0 auto; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: #F8F6F0;\"><\u002Fspan>Pause or exit on notice<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin: 26px 0 0; font: 400 13px/1.6 Outfit, sans-serif; color: rgba(200,198,192,0.8);\">Quoted per month<\u002Fp>\n        <\u002Farticle>\n\n        <article data-om-rv=\"1\" data-om-tilt=\"1\" style=\"display: flex; flex-direction: column; padding: clamp(26px, 2.8vw, 38px); border-radius: 24px; border: 1px solid rgba(200,198,192,0.15); background: linear-gradient(158deg, rgba(248,246,240,0.085), rgba(248,246,240,0.015) 55%, rgba(30,58,95,0.22)); backdrop-filter: blur(24px) saturate(125%); box-shadow: inset 0 1px 0 rgba(248,246,240,0.14), 0 36px 90px -56px rgba(0,0,0,0.95); transition: transform 0.5s cubic-bezier(0.2,0.7,0.2,1), border-color 0.5s ease;\" style-hover=\"border-color: rgba(200,198,192,0.4);\">\n          <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(200,198,192,0.6);\">Model 03<\u002Fp>\n          <h3 style=\"margin: 18px 0 0; font: 500 clamp(25px, 2vw, 32px)/1.12 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Embedded engineers<\u002Fh3>\n          <p style=\"margin: 14px 0 0; font: 300 15.5px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">Senior people inside your team, on your board, in your standups — or under your brand if you are an agency. No recruitment fee, no notice period to hire around.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 26px; padding-top: 22px; border-top: 1px solid rgba(200,198,192,0.14);\">\n            <p style=\"display: flex; gap: 11px; margin: 0; font: 400 13.5px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.8);\"><span style=\"flex: 0 0 auto; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: #C8C6C0;\"><\u002Fspan>Named engineers, no rotation<\u002Fp>\n            <p style=\"display: flex; gap: 11px; margin: 0; font: 400 13.5px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.8);\"><span style=\"flex: 0 0 auto; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: #C8C6C0;\"><\u002Fspan>White-label for agency partners<\u002Fp>\n            <p style=\"display: flex; gap: 11px; margin: 0; font: 400 13.5px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.8);\"><span style=\"flex: 0 0 auto; width: 5px; height: 5px; margin-top: 6px; border-radius: 50%; background: #C8C6C0;\"><\u002Fspan>Scale up or down monthly<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"margin: 26px 0 0; font: 400 13px/1.6 Outfit, sans-serif; color: rgba(200,198,192,0.7);\">Quoted per engineer<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n\n      <div data-om-rv=\"1\" style=\"margin-top: 20px; border-radius: 24px; border: 1px solid rgba(200,198,192,0.14); background: rgba(20,32,46,0.5); backdrop-filter: blur(20px); overflow: hidden;\">\n        <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 0;\">\n          <div style=\"padding: 20px clamp(20px, 2.4vw, 32px); border-bottom: 1px solid rgba(200,198,192,0.14);\"><p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(200,198,192,0.55);\">The comparison<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 20px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.14); border-left: 1px solid rgba(200,198,192,0.1);\"><p style=\"margin: 0; font: 400 15px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(248,246,240,0.6);\">In-house hire<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 20px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.14); border-left: 1px solid rgba(200,198,192,0.1); background: rgba(30,58,95,0.35);\"><p style=\"margin: 0; font: 500 15px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.06em; text-transform: uppercase; color: #F8F6F0;\">Orium<\u002Fp><\u002Fdiv>\n\n          <div style=\"padding: 18px clamp(20px, 2.4vw, 32px); border-bottom: 1px solid rgba(200,198,192,0.08);\"><p style=\"margin: 0; font: 400 14.5px/1.4 Outfit, sans-serif; color: rgba(248,246,240,0.8);\">Time to start<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1);\"><p style=\"margin: 0; font: 300 14px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.52);\">Search, interviews, notice period<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1); background: rgba(30,58,95,0.18);\"><p style=\"margin: 0; font: 400 14px/1.45 Outfit, sans-serif; color: #F8F6F0;\">A scoping call and a start date<\u002Fp><\u002Fdiv>\n\n          <div style=\"padding: 18px clamp(20px, 2.4vw, 32px); border-bottom: 1px solid rgba(200,198,192,0.08);\"><p style=\"margin: 0; font: 400 14.5px/1.4 Outfit, sans-serif; color: rgba(248,246,240,0.8);\">Cost shape<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1);\"><p style=\"margin: 0; font: 300 14px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.52);\">Salary, recruitment fee, equipment, overhead<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1); background: rgba(30,58,95,0.18);\"><p style=\"margin: 0; font: 400 14px/1.45 Outfit, sans-serif; color: #F8F6F0;\">One line on one invoice<\u002Fp><\u002Fdiv>\n\n          <div style=\"padding: 18px clamp(20px, 2.4vw, 32px); border-bottom: 1px solid rgba(200,198,192,0.08);\"><p style=\"margin: 0; font: 400 14.5px/1.4 Outfit, sans-serif; color: rgba(248,246,240,0.8);\">If priorities change<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1);\"><p style=\"margin: 0; font: 300 14px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.52);\">Restructuring, redundancy risk<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-bottom: 1px solid rgba(200,198,192,0.08); border-left: 1px solid rgba(200,198,192,0.1); background: rgba(30,58,95,0.18);\"><p style=\"margin: 0; font: 400 14px/1.45 Outfit, sans-serif; color: #F8F6F0;\">Scale down or pause on notice<\u002Fp><\u002Fdiv>\n\n          <div style=\"padding: 18px clamp(20px, 2.4vw, 32px);\"><p style=\"margin: 0; font: 400 14.5px/1.4 Outfit, sans-serif; color: rgba(248,246,240,0.8);\">What you own at the end<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-left: 1px solid rgba(200,198,192,0.1);\"><p style=\"margin: 0; font: 300 14px/1.45 Outfit, sans-serif; color: rgba(248,246,240,0.52);\">Everything, plus the hiring problem again<\u002Fp><\u002Fdiv>\n          <div style=\"padding: 18px clamp(14px, 1.6vw, 22px); border-left: 1px solid rgba(200,198,192,0.1); background: rgba(30,58,95,0.18);\"><p style=\"margin: 0; font: 400 14px/1.45 Outfit, sans-serif; color: #F8F6F0;\">Code, documentation and runbooks<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"build\" data-screen-label=\"What we build\" style=\"position: relative; z-index: 3; padding: clamp(84px, 10vw, 160px) clamp(18px, 3.4vw, 52px);\">\n    <span data-om-edge=\"1\" aria-hidden=\"true\" style=\"position: absolute; top: 0; left: clamp(18px, 3.4vw, 52px); right: clamp(18px, 3.4vw, 52px); height: 1px; background: linear-gradient(90deg, rgba(200,198,192,0) 0%, rgba(200,198,192,0.4) 22%, rgba(248,246,240,0.65) 50%, rgba(200,198,192,0.4) 78%, rgba(200,198,192,0) 100%); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 4;\"><\u002Fspan>\n    <div style=\"width: 100%; max-width: 1280px; margin: 0 auto;\">\n      <div data-om-rv=\"1\" style=\"max-width: 56ch;\">\n        <p style=\"margin: 0; font: 500 10.5px/1 Outfit, sans-serif; letter-spacing: 0.4em; text-transform: uppercase; color: #C8C6C0;\">What we build<\u002Fp>\n        <h2 style=\"margin: 18px 0 0; font: 400 clamp(34px, 4.6vw, 64px)/1.02 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.025em; color: #F8F6F0;\">Three kinds of work<\u002Fh2>\n        <p style=\"margin: 20px 0 0; font: 300 17px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">Most engagements are one of these, and most start smaller than clients expect.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 46px;\">\n        <article data-om-rv=\"1\" style=\"position: relative; padding: clamp(26px, 2.8vw, 38px); border-radius: 24px; border: 1px solid rgba(200,198,192,0.13); background: linear-gradient(158deg, rgba(248,246,240,0.07), rgba(248,246,240,0.012) 58%, rgba(30,58,95,0.2)); backdrop-filter: blur(22px) saturate(120%); box-shadow: inset 0 1px 0 rgba(248,246,240,0.12); overflow: hidden; transition: border-color 0.5s ease;\" style-hover=\"border-color: rgba(200,198,192,0.4);\">\n          <div style=\"width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(200,198,192,0.4); position: relative; animation: om-float 8s ease-in-out infinite;\">\n            <span style=\"position: absolute; top: 50%; left: 50%; width: 1px; height: 100%; transform: translate(-50%, -50%); background: rgba(200,198,192,0.5);\"><\u002Fspan>\n            <span style=\"position: absolute; top: 50%; left: 50%; width: 60%; height: 60%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(248,246,240,0.3);\"><\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 26px 0 0; font: 500 clamp(24px, 1.9vw, 30px)/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Platforms &amp; products<\u002Fh3>\n          <p style=\"margin: 14px 0 0; font: 300 15.5px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">Customer-facing web platforms, portals and mobile apps. Design, build, launch, and the boring reliability work that keeps them up.<\u002Fp>\n          <p style=\"margin: 22px 0 0; font: 400 12px/1.8 'JetBrains Mono', monospace; letter-spacing: 0.04em; color: rgba(200,198,192,0.55);\">web · mobile · portals · dashboards<\u002Fp>\n        <\u002Farticle>\n\n        <article data-om-rv=\"1\" style=\"position: relative; padding: clamp(26px, 2.8vw, 38px); border-radius: 24px; border: 1px solid rgba(200,198,192,0.13); background: linear-gradient(158deg, rgba(248,246,240,0.07), rgba(248,246,240,0.012) 58%, rgba(30,58,95,0.2)); backdrop-filter: blur(22px) saturate(120%); box-shadow: inset 0 1px 0 rgba(248,246,240,0.12); overflow: hidden; transition: border-color 0.5s ease;\" style-hover=\"border-color: rgba(200,198,192,0.4);\">\n          <div style=\"width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(200,198,192,0.4); position: relative; animation: om-float 8s ease-in-out infinite 0.6s;\">\n            <span style=\"position: absolute; top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); background: rgba(200,198,192,0.5);\"><\u002Fspan>\n            <span style=\"position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); border-radius: 50%; background: #C8C6C0;\"><\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 26px 0 0; font: 500 clamp(24px, 1.9vw, 30px)/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Automation &amp; integration<\u002Fh3>\n          <p style=\"margin: 14px 0 0; font: 300 15.5px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">The manual handoffs between the tools you already pay for. We remove the copy-paste, connect the systems, and add assistants that answer from your own documents.<\u002Fp>\n          <p style=\"margin: 22px 0 0; font: 400 12px/1.8 'JetBrains Mono', monospace; letter-spacing: 0.04em; color: rgba(200,198,192,0.55);\">apis · webhooks · internal tools · assistants<\u002Fp>\n        <\u002Farticle>\n\n        <article data-om-rv=\"1\" style=\"position: relative; padding: clamp(26px, 2.8vw, 38px); border-radius: 24px; border: 1px solid rgba(200,198,192,0.13); background: linear-gradient(158deg, rgba(248,246,240,0.07), rgba(248,246,240,0.012) 58%, rgba(30,58,95,0.2)); backdrop-filter: blur(22px) saturate(120%); box-shadow: inset 0 1px 0 rgba(248,246,240,0.12); overflow: hidden; transition: border-color 0.5s ease;\" style-hover=\"border-color: rgba(200,198,192,0.4);\">\n          <div style=\"width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(200,198,192,0.4); position: relative; animation: om-float 8s ease-in-out infinite 1.2s;\">\n            <span style=\"position: absolute; top: 50%; left: 50%; width: 78%; height: 78%; transform: translate(-50%, -50%) rotate(45deg); border: 1px solid rgba(248,246,240,0.32);\"><\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 26px 0 0; font: 500 clamp(24px, 1.9vw, 30px)/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Teams on demand<\u002Fh3>\n          <p style=\"margin: 14px 0 0; font: 300 15.5px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">Engineers who join your team rather than a vendor queue. Your process, your standards, your repository — and your logo on the work if you need it.<\u002Fp>\n          <p style=\"margin: 22px 0 0; font: 400 12px/1.8 'JetBrains Mono', monospace; letter-spacing: 0.04em; color: rgba(200,198,192,0.55);\">embedded · white-label · overflow capacity<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"growth\" data-screen-label=\"Growth\" style=\"position: relative; z-index: 3; padding: clamp(84px, 10vw, 160px) clamp(18px, 3.4vw, 52px); overflow: hidden;\">\n    <span data-om-edge=\"1\" aria-hidden=\"true\" style=\"position: absolute; top: 0; left: clamp(18px, 3.4vw, 52px); right: clamp(18px, 3.4vw, 52px); height: 1px; background: linear-gradient(90deg, rgba(200,198,192,0) 0%, rgba(200,198,192,0.4) 22%, rgba(248,246,240,0.65) 50%, rgba(200,198,192,0.4) 78%, rgba(200,198,192,0) 100%); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 4;\"><\u002Fspan>\n    <div style=\"position: absolute; top: -10%; left: 50%; width: min(1200px, 130vw); height: min(1200px, 130vw); transform: translateX(-50%); background: radial-gradient(circle at 50% 50%, rgba(30,58,95,0.5) 0%, rgba(30,58,95,0) 62%); pointer-events: none;\"><\u002Fdiv>\n    <div style=\"position: relative; width: 100%; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(30px, 4vw, 64px);\">\n      <div data-om-rv=\"1\">\n        <p style=\"margin: 0; font: 500 10.5px/1 Outfit, sans-serif; letter-spacing: 0.4em; text-transform: uppercase; color: #C8C6C0;\">Growth &amp; visibility<\u002Fp>\n        <h2 style=\"margin: 18px 0 0; max-width: 18ch; font: 400 clamp(34px, 4.6vw, 64px)/1.02 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.025em; color: #F8F6F0;\">Getting found, then getting chosen<\u002Fh2>\n        <p style=\"margin: 20px 0 0; max-width: 44ch; font: 300 17px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">A product nobody finds earns nothing. People now arrive through search results, assistants that answer on your behalf, and paid channels — often all three before they contact you. We work the whole path on the same terms as the build: a flat fee, agreed in advance, reported against enquiries rather than impressions.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px;\">\n          <span style=\"padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(200,198,192,0.2); background: rgba(248,246,240,0.05); font: 400 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: rgba(248,246,240,0.75);\">cost per enquiry<\u002Fspan>\n          <span style=\"padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(200,198,192,0.2); background: rgba(248,246,240,0.05); font: 400 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: rgba(248,246,240,0.75);\">conversion rate<\u002Fspan>\n          <span style=\"padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(200,198,192,0.2); background: rgba(248,246,240,0.05); font: 400 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: rgba(248,246,240,0.75);\">share of search<\u002Fspan>\n          <span style=\"padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(200,198,192,0.2); background: rgba(248,246,240,0.05); font: 400 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: rgba(248,246,240,0.75);\">return on ad spend<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin: 28px 0 0; font: 400 14px/1.7 Outfit, sans-serif; color: rgba(200,198,192,0.75);\">Flat monthly fee, never a percentage of your spend.<\u002Fp>\n      <\u002Fdiv>\n      <div data-om-rv=\"1\" style=\"padding: clamp(26px, 3vw, 40px); border-radius: 24px; border: 1px solid rgba(200,198,192,0.15); background: linear-gradient(158deg, rgba(248,246,240,0.075), rgba(248,246,240,0.015) 55%, rgba(30,58,95,0.22)); backdrop-filter: blur(24px) saturate(125%); box-shadow: inset 0 1px 0 rgba(248,246,240,0.14), 0 36px 90px -56px rgba(0,0,0,0.95);\">\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 24px 0; border-top: 1px solid rgba(200,198,192,0.14);\">\n          <p style=\"margin: 0; font: 400 12px/1.6 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: rgba(200,198,192,0.55);\">01<\u002Fp>\n          <div>\n            <h3 style=\"margin: 0; font: 500 24px/1.2 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Found by search and assistants<\u002Fh3>\n            <p style=\"margin: 9px 0 0; font: 300 15px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">Technical foundations, page structure and schema so your pages are readable by search engines and quotable by the assistants people now ask first.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 24px 0; border-top: 1px solid rgba(200,198,192,0.14);\">\n          <p style=\"margin: 0; font: 400 12px/1.6 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: rgba(200,198,192,0.55);\">02<\u002Fp>\n          <div>\n            <h3 style=\"margin: 0; font: 500 24px/1.2 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Paid where it earns its place<\u002Fh3>\n            <p style=\"margin: 9px 0 0; font: 300 15px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">Google Ads, paid social and retargeting run on a flat monthly fee rather than a percentage of your spend. If a channel does not return, we recommend cutting it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 24px 0; border-top: 1px solid rgba(200,198,192,0.14);\">\n          <p style=\"margin: 0; font: 400 12px/1.6 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: rgba(200,198,192,0.55);\">03<\u002Fp>\n          <div>\n            <h3 style=\"margin: 0; font: 500 24px/1.2 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Pages built to convert<\u002Fh3>\n            <p style=\"margin: 9px 0 0; font: 300 15px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">A dedicated page per campaign, each tested against a single action instead of a homepage asked to do five jobs at once.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 24px 0; border-top: 1px solid rgba(200,198,192,0.14);\">\n          <p style=\"margin: 0; font: 400 12px/1.6 'JetBrains Mono', monospace; letter-spacing: 0.14em; color: rgba(200,198,192,0.55);\">04<\u002Fp>\n          <div>\n            <h3 style=\"margin: 0; font: 500 24px/1.2 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Measurement you can audit<\u002Fh3>\n            <p style=\"margin: 9px 0 0; font: 300 15px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">Server-side conversion tracking and a dashboard showing what each enquiry cost, wired in at build time so the numbers are yours rather than a screenshot from us.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"process\" data-screen-label=\"Process\" style=\"position: relative; z-index: 3; padding: clamp(84px, 10vw, 160px) clamp(18px, 3.4vw, 52px); overflow: hidden;\">\n    <span data-om-edge=\"1\" aria-hidden=\"true\" style=\"position: absolute; top: 0; left: clamp(18px, 3.4vw, 52px); right: clamp(18px, 3.4vw, 52px); height: 1px; background: linear-gradient(90deg, rgba(200,198,192,0) 0%, rgba(200,198,192,0.4) 22%, rgba(248,246,240,0.65) 50%, rgba(200,198,192,0.4) 78%, rgba(200,198,192,0) 100%); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 4;\"><\u002Fspan>\n    <div style=\"position: absolute; bottom: -30%; left: -15%; width: min(1000px, 110vw); height: min(1000px, 110vw); background: radial-gradient(circle at 50% 50%, rgba(30,58,95,0.5) 0%, rgba(30,58,95,0) 64%); pointer-events: none;\"><\u002Fdiv>\n    <div style=\"position: relative; width: 100%; max-width: 1280px; margin: 0 auto;\">\n      <div data-om-rv=\"1\" style=\"max-width: 54ch;\">\n        <p style=\"margin: 0; font: 500 10.5px/1 Outfit, sans-serif; letter-spacing: 0.4em; text-transform: uppercase; color: #C8C6C0;\">Process<\u002Fp>\n        <h2 style=\"margin: 18px 0 0; font: 400 clamp(34px, 4.6vw, 64px)/1.02 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.025em; color: #F8F6F0;\">Four stages, no surprises<\u002Fh2>\n        <p style=\"margin: 20px 0 0; font: 300 17px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.62); text-wrap: pretty;\">You can stop after any stage and keep everything produced up to that point.<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-om-track=\"1\" style=\"position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0 clamp(18px, 2.2vw, 32px); margin-top: clamp(50px, 6vw, 80px);\">\n        <div data-om-rv=\"1\" style=\"position: relative; padding: 34px 0 12px; border-top: 1px solid rgba(200,198,192,0.18);\">\n          <span style=\"position: absolute; top: -4px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: #C8C6C0; box-shadow: 0 0 14px 2px rgba(200,198,192,0.55);\"><\u002Fspan>\n          <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(200,198,192,0.6);\">Stage 01<\u002Fp>\n          <h3 style=\"margin: 14px 0 0; font: 500 27px/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Scope &amp; price<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font: 300 15px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">One conversation, then a written scope with a number on it. What we would build first, and what we would deliberately leave out.<\u002Fp>\n        <\u002Fdiv>\n        <div data-om-rv=\"1\" style=\"position: relative; padding: 34px 0 12px; border-top: 1px solid rgba(200,198,192,0.18);\">\n          <span style=\"position: absolute; top: -4px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: #C8C6C0; box-shadow: 0 0 14px 2px rgba(200,198,192,0.55);\"><\u002Fspan>\n          <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(200,198,192,0.6);\">Stage 02<\u002Fp>\n          <h3 style=\"margin: 14px 0 0; font: 500 27px/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Prove it<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font: 300 15px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">A working slice instead of a deck — enough to put the risky assumption in front of real users before the budget goes in.<\u002Fp>\n        <\u002Fdiv>\n        <div data-om-rv=\"1\" style=\"position: relative; padding: 34px 0 12px; border-top: 1px solid rgba(200,198,192,0.18);\">\n          <span style=\"position: absolute; top: -4px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: #C8C6C0; box-shadow: 0 0 14px 2px rgba(200,198,192,0.55);\"><\u002Fspan>\n          <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(200,198,192,0.6);\">Stage 03<\u002Fp>\n          <h3 style=\"margin: 14px 0 0; font: 500 27px/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Build in the open<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font: 300 15px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">Weekly demos, a board you can read at any hour, commits landing in your repository. No integration week surprise at the end.<\u002Fp>\n        <\u002Fdiv>\n        <div data-om-rv=\"1\" style=\"position: relative; padding: 34px 0 12px; border-top: 1px solid rgba(200,198,192,0.18);\">\n          <span style=\"position: absolute; top: -4px; left: 0; width: 7px; height: 7px; border-radius: 50%; background: #C8C6C0; box-shadow: 0 0 14px 2px rgba(200,198,192,0.55);\"><\u002Fspan>\n          <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(200,198,192,0.6);\">Stage 04<\u002Fp>\n          <h3 style=\"margin: 14px 0 0; font: 500 27px/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Hand over<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font: 300 15px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.6); text-wrap: pretty;\">Documentation, runbooks and a walkthrough with your engineers. We stay for support if it helps, but nothing is locked to us.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"work\" data-screen-label=\"Work\" style=\"position: relative; z-index: 3; padding: clamp(84px, 10vw, 160px) clamp(18px, 3.4vw, 52px);\">\n    <span data-om-edge=\"1\" aria-hidden=\"true\" style=\"position: absolute; top: 0; left: clamp(18px, 3.4vw, 52px); right: clamp(18px, 3.4vw, 52px); height: 1px; background: linear-gradient(90deg, rgba(200,198,192,0) 0%, rgba(200,198,192,0.4) 22%, rgba(248,246,240,0.65) 50%, rgba(200,198,192,0.4) 78%, rgba(200,198,192,0) 100%); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 4;\"><\u002Fspan>\n    <div style=\"width: 100%; max-width: 1280px; margin: 0 auto;\">\n      <div data-om-rv=\"1\" style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 26px;\">\n        <div>\n          <p style=\"margin: 0; font: 500 10.5px/1 Outfit, sans-serif; letter-spacing: 0.4em; text-transform: uppercase; color: #C8C6C0;\">Typical engagements<\u002Fp>\n          <h2 style=\"margin: 18px 0 0; font: 400 clamp(34px, 4.6vw, 64px)/1.02 'Cormorant Garamond', Georgia, serif; letter-spacing: -0.025em; color: #F8F6F0;\">What this looks like in practice<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin: 0; max-width: 36ch; font: 300 15px/1.66 Outfit, sans-serif; color: rgba(248,246,240,0.55); text-wrap: pretty;\">Three engagements, described without client names while those agreements are in place.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 44px;\">\n        <article data-om-rv=\"1\" style=\"border-radius: 24px; border: 1px solid rgba(200,198,192,0.14); background: linear-gradient(158deg, rgba(248,246,240,0.06), rgba(248,246,240,0.012) 58%, rgba(30,58,95,0.2)); backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(248,246,240,0.1), 0 36px 90px -58px rgba(0,0,0,0.95); overflow: hidden; transition: transform 0.5s cubic-bezier(0.2,0.7,0.2,1), border-color 0.5s ease;\" style-hover=\"transform: translateY(-6px); border-color: rgba(200,198,192,0.38);\">\n          <div style=\"position: relative; aspect-ratio: 16 / 10; background: linear-gradient(158deg, rgba(30,58,95,0.5), rgba(13,22,32,0.9)); border-bottom: 1px solid rgba(200,198,192,0.12); overflow: hidden;\">\n            <span style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(200,198,192,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(200,198,192,0.05) 1px, transparent 1px); background-size: 34px 34px;\"><\u002Fspan>\n            <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 9%;\">\n              <div style=\"display: flex; align-items: center; gap: 8px;\">\n                <span style=\"width: 46px; height: 9px; border-radius: 999px; background: rgba(248,24    <span style=\"flex: 1 1 0; height: 95%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, rgba(248,246,240,0.7), rgba(200,198,192,0.15)); transform-origin: bottom; animation: om-bar 7s ease-in-out infinite 1.4000000000000001s;\"><\u002Fspan>\n                <span style=\"flex: 1 1 0; height: 70%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, rgba(248,246,240,0.7), rgba(200,198,192,0.15)); transform-origin: bottom; animation: om-bar 7.4s ease-in-out infinite 1.6800000000000002s;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 7px;\">\n                <span style=\"width: 88%; height: 6px; border-radius: 999px; background: rgba(200,198,192,0.24);\"><\u002Fspan>\n                <span style=\"width: 64%; height: 6px; border-radius: 999px; background: rgba(200,198,192,0.16);\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"position: absolute; left: 0; right: 0; top: 0; height: 14%; background: linear-gradient(180deg, rgba(200,198,192,0.14), rgba(200,198,192,0)); animation: om-scan 9s linear infinite; pointer-events: none;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 26px clamp(20px, 2.2vw, 30px) 30px;\">\n            <p style=\"margin: 0; font: 400 10px/1 'JetBrains Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(200,198,192,0.5);\">Logistics · dispatch portal<\u002Fp>\n            <h3 style=\"margin: 13px 0 0; font: 500 25px/1.14 'Cormorant Garamond', Georgia, serif; color: #F8F6F0;\">Dispatch without the phone calls<\u002Fh3>\n            <p style=\"margin: 11px 0 0; font: 300 15px/1.68 Outfit, sans-serif; color: rgba(248,246,240,0.58); text-wrap: pretty;\">A regional freight operator ran dispatch on a whiteboard and four phones. We built a portal with live driver status and automatic customer notifications, so the office stopped fielding \"where is my delivery\" calls.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-om-rv=\"1\" style=\"border-radius: 24px; border: 1px solid rgba(200,198,192,0.14); background: linear-gradient(158deg, rgba(248,246,240,0.06), rgba(248,246,240,0.012) 58%, rgba(30,58,95,0.2)); backdrop-filter: blur(20px); box-shadow: inset 0 1px 0 rgba(248,246,240,0.1), 0 36px 90px -58px rgba(0,0,0,0.95); overflow: hidden; transition: transform 0.5s cubic-bezier(0.2,0.7,0.2,1), border-color 0.5s ease;\" style-hover=\"transform: translateY(-6px); border-color: rgba(200,198,192,0.38);\">\n          <div style=\"position: relative; aspect-ratio: 16 / 10; background: linear-gradient(158deg, rgba(30,58,95,0.5), rgba(13,22,32,0.9)); border-bottom: 1px solid rgba(200,198,192,0.12); overflow: hidden;\">\n            <span style=\"position: absolute; inset: 0; background-image: linear-gradient(rgba(200,198,192,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(200,198,192,0.05) 1px, transparent 1px); background-size: 34px 34px;\"><\u002Fspan>\n            <div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;\">\n              <div style=\"width: 27%; min-width: 92px; height: 78%; padding: 8px; border-radius: 16px; border: 1px solid rgba(200,198,192,0.5); background: rgba(13,22,32,0.75); box-shadow: 0 20px 50px -26px rgba(0,0,0,0.9); animation: om-float 9s ease-in-out infinite; display: flex; flex-direction: column; gap: 9px;\">\n                <span style=\"width: 34%; height: 4px; margin: 2px auto 4px; border-radius: 999px; background: rgba(200,198,192,0.5);\"><\u002Fspan>\n                <span style=\"width: 100%; height: 22px; border-radius: 7px; background: linear-gradient(120deg, rgba(248,246,240,0.28), rgba(30,58,95,0.5));\"><\u002Fspan>\n                  <div style=\"display: flex; align-items: center; gap: 7px;\">\n                    <span style=\"width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(200,198, nts.get(sec) || 0;\n      counts.set(sec, i + 1);\n      if (n.getBoundingClientRect().top < window.innerHeight * 0.94) return;\n      const d = Math.min(i, 4) * cfg.gap;\n      n.style.willChange = 'opacity, transform, filter, clip-path';\n      n.style.transition = 'none';\n      Object.assign(n.style, cfg.from);\n      pending.push([n, cfg.dur, cfg.ease, d]);\n    });\n\n    if (!pending.length) return;\n    void this.root().offsetHeight;\n    requestAnimationFrame(() => {\n      pending.forEach(([n, dur, ease, d]) => {\n        n.style.transition = ['opacity', 'transform', 'filter', 'clip-path']\n          .map(p => p + ' ' + dur + 'ms ' + ease + ' ' + d + 'ms').join(', ');\n        io.observe(n);\n      });\n    });\n  }\n\n  setupSectionTransitions() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const sections = Array.from(this.root().querySelectorAll('section[id]')).filter(s => s.id !== 'top');\n    if (!sections.length) return;\n\n    const S = this.activeStyle();\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        const el = e.target.querySelector(':scope > [data-om-edge]');\n        if (!el || !e.isIntersecting || el.__omDrawn) return;\n        el.__omDrawn = true;\n        el.style.transformOrigin = S.edgeOrigin;\n        el.style.transition = 'transform ' + S.edgeDur + 'ms ' + S.ease + ', opacity 0.9s ease';\n        el.style.transform = 'scaleX(1)';\n        el.style.opacity = '1';\n        io.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -14% 0px', threshold: 0.01 });\n    sections.forEach(s => io.observe(s));\n\n    if (window.matchMedia('(hover: none)').matches || this.__omScrollBound) return;\n    this.__omScrollBound = true;\n    let raf = null;\n    const drift = () => {\n      raf = null;\n      const vh = window.innerHeight;\n      sections.forEach(sec => {\n        const r = sec.getBoundingClientRect();\n        if (r.bottom < -200 || r.top > vh + 200) return;\n        const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));\n        const glow = sec.__omGlow || (sec.__omGlow = sec.querySelector(':scope > div[style*=\"radial-gradient\"]'));\n        if (glow) glow.style.transform = (glow.style.transform || '').replace(/\\s*translate3d\\([^)]*\\)/, '') + ' translate3d(0,' + (p * -46).toFixed(1) + 'px,0)';\n      });\n    };\n    window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(drift); }, { passive: true });\n    drift();\n  }\n\n  setupHeader() {\n    const header = this.root().querySelector('[data-om-header]');\n    if (!header) return;\n    header.style.transition = 'background 0.4s ease, border-color 0.4s ease, padding 0.4s ease';\n    const onScroll = () => {\n      const past = window.scrollY > 40;\n      header.style.background = past ? 'rgba(13,22,32,0.86)' : 'rgba(13,22,32,0.35)';\n      header.style.borderBottomColor = past ? 'rgba(200,198,192,0.16)' : 'rgba(200,198,192,0.04)';\n      header.style.paddingTop = past ? '11px' : '16px';\n      header.style.paddingBottom = past ? '11px' : '16px';\n    };\n    onScroll();\n    window.addEventListener('scroll', onScroll, { passive: true });\n  }\n\n  setupSpotlight() {\n    const spot = this.root().querySelector('[data-om-spot]');\n    if (!spot || window.matchMedia('(hover: none)').matches) return;\n    let raf = null, x = 0, y = 0;\n    window.addEventListener('pointermove', (ev) => {\n      x = ev.clientX; y = ev.clientY;\n      if (raf) return;\n      raf = requestAnimationFrame(() => {\n        raf = null;\n        spot.style.opacity = '1';\n        spot.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';\n      });\n    }, { passive: true });\n  }\n\n  setupCycler() {\n    const el = this.root().querySelector('[data-om-cycle]');\n    if (!el) return;\n    const words = ['platforms', 'apps', 'automations', 'integrations', 'dashboards'];\n    let i = 0;\n    el.style.transition = 'opacity 0.34s
